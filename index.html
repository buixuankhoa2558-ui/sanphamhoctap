<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng hợp đường dẫn ôn THPT</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Container kính mờ (Glassmorphism) */
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2.5rem 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            position: relative;
            z-index: 10;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .combo-section {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .btn-combo {
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            font-weight: bold;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border: none;
            color: var(--primary);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:  5px 5px 10px #d1d1d1, -5px -5px 10px #ffffff;
        }

        .btn-combo:hover {
            transform: translateY(-3px);
            box-shadow:  8px 8px 15px #d1d1d1, -8px -8px 15px #ffffff;
        }

        .btn-combo.active {
            background: var(--primary);
            color: white;
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.2);
        }

        .subjects-section {
            display: none;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }

        .subjects-section.active {
            display: flex;
            animation: fadeIn 0.4s ease-in-out;
        }

        .btn-subject {
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            background-color: #ffffff;
            border: 2px solid transparent;
            color: var(--text-main);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-subject:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: scale(1.05);
        }

        .btn-subject.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .content-section {
            display: none;
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .content-section.active {
            display: block;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .content-section h2 {
            color: var(--primary);
            border-bottom: 3px dashed #c7d2fe;
            padding-bottom: 0.5rem;
            margin-top: 0;
            text-align: center;
        }

        .content-section h3 {
            color: #312e81;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-section h3::before {
            content: '📌';
        }

        .chapter-box {
            background: linear-gradient(to right, #f8fafc, #ffffff);
            border-left: 5px solid var(--primary);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 0 12px 12px 0;
            transition: transform 0.2s ease;
        }

        .chapter-box:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .content-section a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .content-section a:hover {
            background: #dbeafe;
            text-decoration: underline;
        }

        /* Nút phát nhạc nổi ở góc */
        .music-player {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .btn-music {
            background: #ffffff;
            border: none;
            padding: 15px 20px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold;
            color: var(--primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-music:hover {
            transform: scale(1.1);
            background: var(--primary);
            color: white;
        }

        /* Biểu tượng sách chạy quanh viền */
        .border-books {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Không cho click trúng */
            z-index: 9999;
        }

        .border-books span {
            position: absolute;
            font-size: 32px;
            animation: borderRun 24s linear infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Tạo quỹ đạo chạy quanh mép màn hình */
        @keyframes borderRun {
            0% { top: 10px; left: 10px; transform: rotate(0deg); }
            24% { top: 10px; left: calc(100vw - 50px); transform: rotate(15deg); }
            25% { top: 10px; left: calc(100vw - 50px); transform: scaleX(-1) rotate(0deg); } /* Lật hướng */
            49% { top: calc(100vh - 50px); left: calc(100vw - 50px); transform: scaleX(-1) rotate(-15deg); }
            50% { top: calc(100vh - 50px); left: calc(100vw - 50px); transform: scaleX(-1) rotate(0deg); }
            74% { top: calc(100vh - 50px); left: 10px; transform: scaleX(-1) rotate(15deg); }
            75% { top: calc(100vh - 50px); left: 10px; transform: rotate(0deg); } /* Lật lại hướng */
            99% { top: 10px; left: 10px; transform: rotate(-15deg); }
            100% { top: 10px; left: 10px; transform: rotate(0deg); }
        }

        /* Giãn cách các cuốn sách chạy nối đuôi nhau */
        .border-books span:nth-child(1) { animation-delay: 0s; content: "📚"; }
        .border-books span:nth-child(2) { animation-delay: -4.8s; }
        .border-books span:nth-child(3) { animation-delay: -9.6s; }
        .border-books span:nth-child(4) { animation-delay: -14.4s; }
        .border-books span:nth-child(5) { animation-delay: -19.2s; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>

    <div class="chapter-box">
        <h3>3. Kiến thức về Hình thức của từ (Word Form)</h3>
        <p><strong>Nội dung cốt lõi:</strong> Nhận diện vị trí từ loại (Danh từ, Động từ, Tính từ, Trạng từ), tiền tố và hậu tố.</p>
        <ul>
            <li><a href="#" target="_blank">ZIM - Tổng hợp quy tắc cấu tạo từ (Word Form)</a></li>

</template>

<script>
    // Hàm phát âm thanh click
    function playClick() {
        const clickSound = document.getElementById('click-sound');
        clickSound.currentTime = 0; // Trả về đầu file để có thể click liên tục
        clickSound.play().catch(e => console.log("Trình duyệt chặn autoplay"));
    }

    // Gắn âm thanh click vào tất cả các thẻ a
    document.addEventListener('click', function(e) {
        if(e.target.tagName.toLowerCase() === 'a') {
            playClick();
        }
    });

    const dataStructure = {
        'A00': [
            { id: 'van', name: '📖 Văn' },
            { id: 'toan', name: '📐 Toán' },
            { id: 'li', name: '⚡ Vật Lí' },
            { id: 'hoa', name: '🧪 Hóa Học' }
        ],
        'A01': [
            { id: 'van', name: '📖 Văn' },
            { id: 'toan', name: '📐 Toán' },
            { id: 'li', name: '⚡ Vật Lí' },
            { id: 'anh', name: '🇬🇧 Tiếng Anh' }
        ]
    };

    function showSubjects(combo, btnElement) {
        playClick(); // Phát âm thanh
        
        // Reset styles for combo buttons
        document.querySelectorAll('.btn-combo').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        // Hide content container when switching combos
        document.getElementById('content-container').classList.remove('active');

        // Render subjects based on selected combo
        const container = document.getElementById('subjects-container');
        container.innerHTML = '';
        
        dataStructure[combo].forEach(subject => {
            const btn = document.createElement('button');
            btn.className = 'btn-subject';
            btn.textContent = subject.name;
            btn.onclick = () => showContent(subject.id, btn);
            container.appendChild(btn);
        });

        container.classList.add('active');
    }

    function showContent(subjectId, btnElement) {
        playClick(); // Phát âm thanh

        // Highlight active subject button
        document.querySelectorAll('.btn-subject').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        // Fetch template content and insert into container
        const template = document.getElementById(`tpl-${subjectId}`);
        const contentContainer = document.getElementById('content-container');
        
        if(template) {
            contentContainer.innerHTML = template.innerHTML;
            contentContainer.classList.add('active');
        }
    }

    // Điều khiển nhạc nền thư giãn
    let isMusicPlaying = false;
    function toggleMusic() {
        playClick(); // Phát âm thanh click của nút
        const bgm = document.getElementById('bg-music');
        const btn = document.getElementById('btn-toggle-music');
        
        if(isMusicPlaying) {
            bgm.pause();
            btn.innerHTML = '🎧 Bật nhạc thư giãn';
            btn.style.background = '#ffffff';
            btn.style.color = 'var(--primary)';
            isMusicPlaying = false;
        } else {
            bgm.volume = 0.5; // Giảm âm lượng nhạc nền xuống 50% để không làm chói tai
            bgm.play();
            btn.innerHTML = '⏸️ Tắt nhạc';
            btn.style.background = 'var(--primary)';
            btn.style.color = 'white';
            isMusicPlaying = true;
        }
    }
</script>
